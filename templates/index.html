<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelReper Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0c; color: #e2e8f0; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glow-green { text-shadow: 0 0 10px rgba(72, 199, 116, 0.5); }
        .glow-red { text-shadow: 0 0 10px rgba(241, 70, 104, 0.5); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tighter bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">TELREPER <span class="text-xs font-mono border border-blue-500/30 px-2 py-1 rounded text-blue-400 align-middle ml-2">v2026.1</span></h1>
                <p class="text-slate-500 text-sm mt-1 uppercase tracking-widest font-semibold">Mass Reporting Control Center</p>
            </div>
            <div class="flex gap-4">
                <div class="glass px-6 py-3 rounded-2xl text-center">
                    <p class="text-[10px] uppercase text-slate-500 font-bold">Sessions</p>
                    <p id="session-count" class="text-2xl font-black text-blue-400">{{ sessions|length }}</p>
                </div>
                <div id="status-indicator" class="glass px-6 py-3 rounded-2xl text-center border-green-500/20">
                    <p class="text-[10px] uppercase text-slate-500 font-bold">Status</p>
                    <p class="text-sm font-bold text-green-400">ONLINE</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Left Column: Controls -->
            <div class="lg:col-span-5 space-y-6">
                <section class="glass p-6 rounded-3xl">
                    <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                        <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
                        Configuration
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] uppercase font-black text-slate-500 ml-1 mb-1 block">Target Username/Link</label>
                            <input type="text" id="target" placeholder="@abusive_channel" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500/50 transition-all text-sm">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] uppercase font-black text-slate-500 ml-1 mb-1 block">Reason</label>
                                <select id="method" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500/50 transition-all text-sm appearance-none">
                                    {% for r in reasons %}
                                    <option value="{{ r }}">{{ r|replace('_', ' ')|capitalize }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] uppercase font-black text-slate-500 ml-1 mb-1 block">Reports per Acc</label>
                                <input type="number" id="reports" value="5" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500/50 transition-all text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="text-[10px] uppercase font-black text-slate-500 ml-1 mb-1 block">Optional Comment</label>
                            <textarea id="comment" rows="2" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500/50 transition-all text-sm resize-none">This channel violates Telegram safety guidelines.</textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-4 pt-2">
                            <div>
                                <label class="text-[10px] uppercase font-black text-slate-500 ml-1 mb-1 block">Max Concurrent</label>
                                <input type="number" id="concurrent" value="3" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500/50 transition-all text-sm">
                            </div>
                            <div>
                                <label class="text-[10px] uppercase font-black text-slate-500 ml-1 mb-1 block">Min Delay (s)</label>
                                <input type="number" id="min_delay" value="2" class="w-full bg-black/40 border border-white/5 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500/50 transition-all text-sm">
                            </div>
                        </div>

                        <button id="start-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-2xl mt-4 shadow-lg shadow-blue-500/20 transition-all active:scale-[0.98]">
                            INITIATE MASS REPORT
                        </button>
                    </div>
                </section>

                <section class="glass p-6 rounded-3xl">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">Live Statistics</h2>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                            <p class="text-[10px] font-bold text-slate-500 uppercase">Success</p>
                            <p id="stat-success" class="text-2xl font-black text-green-400 glow-green">0</p>
                        </div>
                        <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                            <p class="text-[10px] font-bold text-slate-500 uppercase">Failed</p>
                            <p id="stat-failed" class="text-2xl font-black text-red-400 glow-red">0</p>
                        </div>
                        <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                            <p class="text-[10px] font-bold text-slate-500 uppercase">Flood</p>
                            <p id="stat-flood" class="text-2xl font-black text-yellow-400">0</p>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right Column: Logs & Sessions -->
            <div class="lg:col-span-7 flex flex-col gap-8">
                <section class="glass rounded-3xl overflow-hidden flex flex-col flex-1">
                    <div class="px-6 py-4 border-b border-white/5 flex justify-between items-center bg-white/5">
                        <h2 class="text-lg font-bold">Execution Logs</h2>
                        <button id="clear-logs" class="text-[10px] font-black uppercase text-slate-400 hover:text-white transition-colors">Clear</button>
                    </div>
                    <div id="log-container" class="p-6 h-[450px] overflow-y-auto mono text-xs space-y-2 bg-black/40">
                        <div class="text-slate-500 italic opacity-50">Waiting for report initiation...</div>
                    </div>
                </section>

                <section class="glass p-6 rounded-3xl">
                    <h2 class="text-lg font-bold mb-4">Active Sessions</h2>
                    <div id="session-list" class="flex flex-wrap gap-2">
                        {% for s in sessions %}
                        <span class="px-3 py-1 bg-white/5 border border-white/10 rounded-full text-[11px] font-bold text-blue-300">@{{ s }}</span>
                        {% endfor %}
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const logContainer = document.getElementById('log-container');
        const startBtn = document.getElementById('start-btn');

        function addLog(msg, color = '#e2e8f0') {
            const entry = document.createElement('div');
            entry.className = 'border-l-2 pl-3 py-1 border-white/10 animate-in fade-in slide-in-from-left-2 duration-300';
            entry.innerHTML = `<span class="text-slate-600 mr-2">[${new Date().toLocaleTimeString()}]</span> <span style="color: ${color}">${msg}</span>`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        startBtn.addEventListener('click', () => {
            const data = {
                target: document.getElementById('target').value,
                method: document.getElementById('method').value,
                reports: document.getElementById('reports').value,
                comment: document.getElementById('comment').value,
                max_concurrent: document.getElementById('concurrent').value,
                min_delay: document.getElementById('min_delay').value,
            };

            if (!data.target) {
                addLog('Error: Please specify a target!', '#f14668');
                return;
            }

            addLog(`Initiating mass report process for ${data.target}...`, '#3b82f6');
            socket.emit('start_report', data);
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            startBtn.innerText = 'REPORTING IN PROGRESS...';
        });

        socket.on('log_update', (data) => {
            addLog(data.msg, data.color);
        });

        socket.on('stats_update', (stats) => {
            document.getElementById('stat-success').innerText = stats.success;
            document.getElementById('stat-failed').innerText = stats.failed;
            document.getElementById('stat-flood').innerText = stats.flood;
        });

        socket.on('report_finished', (data) => {
            addLog('MISSION COMPLETE: All reports processed.', '#48c774');
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            startBtn.innerText = 'INITIATE MASS REPORT';
        });

        document.getElementById('clear-logs').addEventListener('click', () => {
            logContainer.innerHTML = '';
        });
    </script>
</body>
</html>
